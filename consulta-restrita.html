<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acervo restrito | Fundação Belfegor</title>
<link rel="stylesheet" href="css/portal.css?v=4">
<script type="module" src="js/acervo-restrito.js"></script>
</head>
<body>
<header class="bf-header"><div class="bf-header-inner"><div><a class="bf-brand" href="index.html">Fundação Belfegor</a><span class="bf-subtitle">Acervo restrito</span></div><a class="bf-back" href="arquivos.html">Voltar a Arquivos</a></div></header>
<main class="frame">
<h1>Acervo restrito</h1>
<p id="estado" role="status">Consultando disponibilidade do acervo…</p>
<form id="credencial" class="panel" hidden>
<h2>Credencial institucional</h2>
<label for="email">E-mail da conta aprovada</label>
<div class="field"><input id="email" type="email" autocomplete="username" required></div>
<label for="senha">Senha</label>
<div class="field"><input id="senha" type="password" autocomplete="current-password" required></div>
<button>Entrar no acervo</button>
</form>
<section id="consulta" class="panel" hidden>
<form id="busca"><label for="codigo">Código do documento</label>
<div class="field"><input id="codigo" maxlength="64" required><button>Consultar</button></div></form>
<ul id="lista" class="records"></ul>
<button id="sair" type="button">Sair do acervo</button>
</section>
<article id="documento" class="panel" aria-live="polite" hidden></article>
</main>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Fundação Belfegor</title>
<link rel="stylesheet" href="css/portal.css?v=6">
<script type="module" src="js/entrada.js?v=6"></script>
</head>
<body>
<header class="bf-header"><div class="bf-header-inner"><div><a class="bf-brand" href="index.html"><span class="bf-emblem" aria-hidden="true"></span><span class="bf-identity"><strong>Fundação Belfegor</strong></span></a><span class="bf-subtitle">Identificação funcional</span></div><a class="bf-back" href="index.html">Voltar ao portal</a></div></header>
<main class="frame">
<h1>Entrar no portal</h1>
<section class="panel">
<h2>Credencial da Fundação</h2>
<p>Use o usuário e a senha de jogo que o GM entregou após aprovar sua ficha.</p>
<form id="entrada">
<label for="usuario">Usuário</label>
<div class="field"><input id="usuario" required maxlength="48" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
<label for="senha">Senha de jogo</label>
<div class="field"><input id="senha" type="password" required maxlength="128" autocomplete="current-password"></div>
<button>Entrar</button>
<p id="resultado" role="status"></p>
</form>
</section>
<p>Precisa preparar uma ficha? <a href="cadastro.html">Abra o Registro Funcional</a>.</p>
</main>
</body>
</html>
